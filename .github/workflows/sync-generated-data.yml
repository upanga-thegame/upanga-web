name: Sync generated website data

on:
  push:
    branches:
      - main
    paths:
      - "docs/CHANGELOG.MD"
      - "docs/FAQ.MD"
      - "scripts/**"
      - "tests/generated-content.test.mjs"
      - ".github/workflows/sync-generated-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate and verify website content
        run: |
          node scripts/generate-changelog.mjs
          node scripts/generate-faq.mjs
          node --test tests/generated-content.test.mjs

      - name: Commit generated content
        run: |
          if git diff --quiet -- faq.html changelog.html data/faq.json data/changelog.json; then
            echo "Generated content is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faq.html changelog.html data/faq.json data/changelog.json
          git commit -m "Update generated website content"
          git push origin HEAD:main
